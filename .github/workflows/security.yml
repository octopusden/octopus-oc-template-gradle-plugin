# INTERNAL — triggered on push to main, nightly, and manually; never on pull_request.
name: Security

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'   # every Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  security:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-security-reports.yml@v2.4.1
    with:
      java-version: '11'
    secrets: inherit
